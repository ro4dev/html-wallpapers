<!DOCTYPE html>
<html>

<head>
    <meta charset="utf-8" />
    <title>Efecto Matrix</title>
    <style type="text/css">
        * {
            margin: 0;
            padding: 0;
        }

        html,
        body {
            width: 100%;
            height: 100%;
            overflow: hidden;
            background-color: #000;
        }

        canvas {
            display: block;
        }
    </style>
</head>

<body>
    <canvas id="matrixCodeSpace"> </canvas>
    <script type="text/javascript">
        const matrixCodeSpace = document.getElementById("matrixCodeSpace");
        const matrixContext = matrixCodeSpace.getContext("2d");

        matrixCodeSpace.width = window.innerWidth;
        matrixCodeSpace.height = window.innerHeight;

        const width = matrixCodeSpace.width;
        const height = matrixCodeSpace.height;

        const fontSize = 15;
        matrixContext.font = fontSize + "pt monospace";

        const columns = Math.floor(width / 20) + 1;
        const trailLength = 25;

        // Each column stores: head position (in rows) and when to reset
        const drops = Array(columns).fill(0).map(() => ({
            row: 0,
            resetAt: 100 + Math.random() * 10000 / 20
        }));

        function matrix() {
            matrixContext.fillStyle = "#000";
            matrixContext.fillRect(0, 0, width, height);

            for (let i = 0; i < drops.length; i++) {
                const drop = drops[i];
                const x = i * 20;

                // Draw trail from head backwards with fading opacity
                for (let t = 0; t < trailLength; t++) {
                    const rowPos = drop.row - t;
                    if (rowPos < 0) break;

                    const y = rowPos * 20 + fontSize;
                    const alpha = Math.max(0, 1 - t / trailLength);
                    matrixContext.fillStyle = "rgba(0, 255, 0, " + alpha + ")";
                    const char = String.fromCharCode(33 + Math.random() * 94);
                    matrixContext.fillText(char, x, y);
                }

                drop.row++;

                if (drop.row > drop.resetAt) {
                    drop.row = 0;
                    drop.resetAt = 100 / 20 + Math.random() * 10000 / 20;
                }
            }
        }

        setInterval(matrix, 50);
    </script>
</body>

</html>
